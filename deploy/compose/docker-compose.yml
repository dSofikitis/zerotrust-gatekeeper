name: zerotrust-gatekeeper

services:
  redis:
    image: redis:7-alpine
    container_name: zt-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  opa:
    image: openpolicyagent/opa:0.68.0
    container_name: zt-opa
    command:
      - run
      - --server
      - --addr=:8181
      - --log-level=info
      - /policies
    ports:
      - "8181:8181"
    volumes:
      - ../../policies:/policies:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "--server-addr=http://localhost:8181", "data"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth-issuer:
    build:
      context: ../../services/auth-issuer
    image: zerotrust-gatekeeper/auth-issuer:dev
    container_name: zt-auth-issuer
    environment:
      AUTH_ADDR: ":8081"
      AUTH_TOKEN_TTL: "15m"
    ports:
      - "8081:8081"

  backend-echo:
    build:
      context: ../../services/backend-echo
    image: zerotrust-gatekeeper/backend-echo:dev
    container_name: zt-backend-echo
    environment:
      ECHO_ADDR: ":8082"
    ports:
      - "8082:8082"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: zt-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: zt-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
